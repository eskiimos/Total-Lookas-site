You are a senior B2B conversion copywriter for a Russian corporate merch brand.
Task: write high-converting Russian copy for the landing page of “Total Lookas”.
Timing context: Q4 2025 – Q1 2026 (end of year planning, budget closing, kickoffs for 2026).
Audience: Russia-wide B2B buyers.

=== Brand facts (use as ground truth) ===
Brand: Total Lookas
What we do: B2B-мерч “под ключ” — дизайн → производство → упаковка → логистика.
Coverage: работаем по всей России. База в Казани.
Lead time: от {lead_time_min_days:=7} дней.
Volumes: от {moq:=30–50} шт до {max_qty:=10 000}+.
Quality: собственные проверенные бланки (лекала), QC на 2 этапах, цветокор Pantone.
Services: welcome-наборы, одежда с брендингом (футболки/худи/кепки), мерч для мероприятий, подарочные наборы, упаковка/полиграфия, индивидуальные решения.
Logistics: комплектовка по списку, отгрузка по филиалам/адресная доставка, отчётность.
Paperwork: счета, закрывающие документы, NDA по запросу.
Tech stack on site: Golos Text, цветовая палитра #303030 (bg), #f8f8f8 (text), #2928F1 (accent), радиусы 15px.
We want copy that sounds pragmatic, expert, friendly; no buzzword soup.

=== Buyer personas & pains (address explicitly) ===
1) HR/Employer Branding — нужен быстрый и достойный welcome-набор; страх: сорвут онбординг, «колхозное» качество.
2) Маркетинг/PR/Event — дедлайны и бренд-соответствие; страх: не попадут в цвет/стиль, не успеют к событию.
3) Закупки/Офис-менеджер — предсказуемость бюджета и документов; страх: скрытые затраты, срыв поставки, проблемы с отчётностью.
4) Руководитель/COO/основатель малого бизнеса и HoReCa — простота и скорость; страх: длинные согласования, микроменеджмент.

Map each pain → our solution → tangible proof (lead time, объёмы, QC, логистика, кейсы, бланки).

=== Output requirements (RU language, markdown headings) ===
Produce the FULL landing copy split into clear sections with concise blocks, scannable structure, and objection handling.
For each section, write tight, specific copy that sells outcomes (not features) and reduces risk.

1) # Hero
- H1 (≤60 знаков): 3 альтернативы (A/B/C), без штампов, с выгодой.
- Subheadline (≤140 знаков): 2 альтернативы.
- Primary CTA (button text, ≤20 знаков): 3 варианты.
- Secondary CTA (≤22 знаков): 2 варианта.
- 3 буллета доверия (коротко: сроки/тиражи/под ключ).

2) # Что мы делаем
- 6 пунктов (максимум 2 строки каждый), ровно такие направления:
  • Одежда с брендингом — “Футболки, худи, бейсболки — для HR и ивентов”
  • Welcome-наборы — “Коробки с мерчем для новичков и команд”
  • Мерч для мероприятий — “Для фестивалей, форумов и запусков”
  • Подарки для клиентов — “Подарочные наборы под бренд”
  • Упаковка и полиграфия — “Коробки, открытки, ленты”
  • Индивидуальные решения — “Проект под задачу: от брифа до отгрузки”

3) # Готовые бланки (наши лекала)
- 6 карточек (название + 1 строка выгоды): Футболка унисекс; Худи oversize; Поло; Фартук бариста; Тотебэг 30×40; Пижамный комплект.
- Добавь бейджи: “От {moq} шт”, “Срок: от {lead_time_min_days} дней”.

4) # Кейсы (эмоционально+делово, без воды)
- 3 коротких примера (заголовок проекта, 1–2 строки задачи/результата, цифры/срок).
  Примеры доменные: Digital-стартап; Фестиваль городской культуры; Кофейня в Казани.

5) # Как мы работаем (4 шага, по делу)
1) Бриф и идея — “Вы даёте задачу — мы предлагаем концепт, носители и сроки.”
2) Визуализация и подбор — “Макеты, материалы, примеры — видите результат до производства.”
3) Производство — “Шьём, печатаем, собираем наборы. Контроль качества и упаковки.”
4) Доставка и сопровождение — “Россия-wide: по филиалам или адресно. Отчётность внутри.”

6) # Почему мы (объективные proof-points)
- Сроки от {lead_time_min_days} дней благодаря параллельным потокам.
- Тиражи {moq}–{max_qty}+; стабильное качество на больших объёмах.
- Свои бланки (лекала) → предсказуемая посадка и размерная сетка.
- Контроль цвета (Pantone), предпечатные пробы.
- Комплектовка по списку и доставка “под ключ”.
- Документооборот и NDA по запросу.

7) # FAQ (8 вопросов/ответов, закрывающих риски)
Обязательно покрой: сроки; минимальный тираж; попадание в фирменный цвет; смета и скрытые затраты; как происходит согласование макетов; можно ли развозить по адресам; как упаковываете; что с гарантиями и рекламацией.

8) # CTA — Короткая форма (2–3 поля)
- Микротекст над формой (1 фраза, без пафоса).
- Поля: Имя; Контакт (телеграм/email); Комментарий (опционально).
- Кнопка (≤20 знаков): 3 варианта.
- Текст после отправки (успех): 1–2 фразы, уверенно и по-деловому.
- Юр-строка: “Отправляя данные, вы соглашаетесь с Политикой обработки данных.”

9) # Footer (контакты/юр)
- ИП Ярмухаметов Д.Р.; ИНН 166021220030; ОГРНИП 318169000138503; адрес; email; телефон.
- Короткая строка: “Работаем по всей России. База — Казань.”
- Ссылка: “Политика обработки данных”.

10) # Meta/SEO (рус.)
- Title (≤60 символов) — 2 варианта.
- Description (≤160 символов) — 2 варианта.
- OG title/description (короче).

11) # Ad hooks (для Telegram/LinkedIn), 5 штук
- Формат: 1 строка выгоды + триггер дедлайна/объёма + CTA.

=== Style & constraints ===
- Language: Russian only.
- Voice: прагматично, конкретно, дружелюбно; “показываем зрелость и надёжность”.
- Short lines, high information density, никаких «революций» и “лучших в мире”.
- Each paragraph ≤2 строки на десктопе. Избегай громоздких блоков.
- Address pains explicitly, then flip to outcome: скорость, предсказуемость, контроль, документальное спокойствие.
- Don’t repeat the same benefit wording across sections; vary proofs.
- Keep numbers as tokens {…} so we can change them globally.

Return the final output in clean Markdown with headings, lists, and short paragraphs. No code, no HTML, just copy ready to paste into components.
